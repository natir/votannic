[package]
name    = "votannic"
version = "0.1.0"
authors = [
	"Pierre Marijon <pierre@marijon.fr>"
]

description  = "A tools to generate all possible outcomes in Warhammer 40k system"
edition      = "2024"
rust-version = "1.92"

homepage      = "https://natir.github.io/votannic"
repository    = "https://github.com/natir/votannic"
documentation = "https://natir.github.io/votannic"

readme       = "Readme.md"
license-file = "LICENSE"


[lib]
name = "votannic"
path = "src/lib.rs"

[[bin]]
name = "votannic"
path = "src/main.rs"


[dependencies]
## API connection and parsing
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1" }


## Probabilistics management
fraction      = { version = "0.17" }
tyche         = { version = "0.3" }
petgraph      = { version = "0.8" }
enum_dispatch = { version = "0.3" }

## Other
rustc-hash    = { version = "2" }
typed-builder = { version = "0.23" }
rand          = { version = "0.9" }
regex         = { version = "1" }

## CLI management
clap        = { version = "4", features = ["derive"] }

## Error management
thiserror   = { version = "2" }
anyhow      = { version = "1" }

## Logging management
log         = { version = "0.4" }
stderrlog   = { version = "0.6" }

## Profiling
hotpath    = { version = "0.28" }
peak_alloc = { version = "0.3", optional = true }

[dev-dependencies]
## Functional test
assert_cmd = { version = "2" }
tempfile   = { version = "3" }

## Benchmark management
criterion  = { version = "0.8" }


[features]
default = []
bench = []

profiling = ["dep:peak_alloc", "hotpath/hotpath", "hotpath/hotpath-alloc", "hotpath/hotpath-cpu"]


[profile]
release   = { lto = "fat", opt-level = 3, overflow-checks = false, panic = "abort", incremental = false, strip = true }
debug     = { codegen-units = 256 }
test      = { opt-level = 1, codegen-units = 256 }
bench     = { codegen-units = 1, lto = "thin" }

profiling = { inherits = "release", debug = true, strip = false }
tarpaulin = { inherits = "test", opt-level = 0, debug = true }
